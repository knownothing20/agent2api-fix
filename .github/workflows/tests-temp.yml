# 临时工作流：只为本次同步（upstream/beta 的 9 个提交）跑一次单元测试。
#
# 为什么需要它：docker.yml 只 `cargo build`、build.yml 也只构建产物，**两条 CI 都不跑测试**；
# 而本机（Windows）缺 Windows SDK / MSYS 的 link 顶掉 MSVC 的 link.exe，cargo 起不来。
#
# ⚠️ 合并到 main 之前删掉本文件（与上次同步同一约定）。
name: tests-temp

# 注意：GitHub 只允许 dispatch「默认分支上已存在」的工作流，所以这条**靠 push 触发**。
on:
  push:
    branches:
      - upstream-beta-sync
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      # ⚠️ 必须 set -o pipefail：否则 `cargo test | tail` 的退出码是 tail 的（恒 0），
      # 测试编译失败也会被报成「成功」——实测踩过。
      - name: cargo test -p agent2api-server
        shell: bash
        run: |
          set -o pipefail
          cd desktop-tauri/src-tauri
          cargo test -p agent2api-server 2>&1 | tail -150
