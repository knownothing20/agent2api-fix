# 临时工作流：只为本分支（上游 2.9.0 合并）跑一次单元测试。
#
# 为什么需要它：既有的 docker.yml 只 `cargo build`、build.yml 也只构建产物，
# **两条 CI 都不跑测试**；而本机（Windows）因为缺 Windows SDK / MSYS 的 link 顶掉
# MSVC 的 link.exe，cargo 起不来。于是用这条一次性工作流在 Linux 上拿测试证据。
#
# ⚠️ 合并到 main 之前应当删掉本文件（或者把它并入 docker.yml 成为一个正式步骤）。
name: tests-temp

# 注意：GitHub 只允许 dispatch「默认分支上已存在」的工作流，所以这条**靠 push 触发**
# （推本分支即跑），而不是 workflow_dispatch。
on:
  push:
    branches:
      - upstream-2.9.0-port
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      # amd64 原生构建不需要额外系统依赖（依赖全是纯 Rust + rusqlite bundled 的
      # SQLite 源码），见 Dockerfile 的 builder 阶段。
      # ⚠️ 必须 set -o pipefail：否则 `cargo test | tail` 的退出码是 tail 的（恒 0），
      # 测试编译失败也会被报成「成功」——实测踩过。
      - name: cargo test -p agent2api-server
        shell: bash
        run: |
          set -o pipefail
          cd desktop-tauri/src-tauri
          cargo test -p agent2api-server 2>&1 | tail -150
