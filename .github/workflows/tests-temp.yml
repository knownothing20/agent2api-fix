name: tests-temp

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - name: cargo test -p agent2api-server
        shell: bash
        run: |
          set -o pipefail
          cd desktop-tauri/src-tauri
          cargo test -p agent2api-server 2>&1 | tail -60
