name: docker

# ── 仓库可见性：public（2026-10-10）──────────────────────────────
# 本仓库原为 private（免费额度 2000 分钟/月）。2026-10-10 因额度/付款问题被停用：
# 报 "recent account payments have failed or your spending limit needs to be
# increased"，并且 **GitHub 会把该 workflow 自动置为 `disabled_manually`** ——
# 表现是 push 不再触发任何 run、手动触发报 422。恢复要两步：
#   1. `gh workflow enable docker.yml --repo <owner>/<repo>`（重新启用 workflow）
#   2. 确认仓库可见性/额度（public 仓库的 Actions 免费无限，见 GitHub 官方政策）
# 本仓库已改为 **public** 以避免再次撞额度；同时删掉了只服务桌面壳的 build.yml
# （macOS runner 按 10 倍计费、Windows 2 倍，而本项目只用 Docker 部署）。
# 若将来改回 private，请记得这条流水线每次 push main 都会跑，会重新开始计费。

# 我们自己的镜像流水线（与 deveco-fix 同一套做法）：
#   push main / 打 v* tag / 手动 → 构建并推 ghcr.io/knownothing20/agent2api-fix
#
# ── 与上游本文件的差异（有意为之）────────────────────────────
#   · 目标仓库：上游推 Docker Hub 的 aimodcc/agent2api（用作者的 secrets）；
#     我们推自己的 GHCR，凭据用内置 GITHUB_TOKEN，不需要任何 secret。
#   · 触发：上游只在打 tag 时构建；我们额外在 push main 时也构建 ——
#     「改完就有一条可部署的镜像」，与 deveco-fix 的手感一致。
#   · 架构：只出 linux/amd64（124 是 x86_64）。要 arm64 就把 platforms 改回
#     linux/amd64,linux/arm64 —— Dockerfile 的 builder 固定跑 $BUILDPLATFORM，
#     arm64 走交叉编译，不需要 QEMU。
#
# ── 首次构建会很慢（正常）────────────────────────────────────
#   Dockerfile 用「空桩依赖层」先编完整棵 Rust 依赖树再编源码；这里用
#   type=gha 缓存挂到 Actions cache，第二轮起只重编源码层。
#
# ── 镜像 label（部署核对的依据）──────────────────────────────
#   metadata-action 会打上 org.opencontainers.image.revision（= 提交 sha）：
#     docker inspect agent2api --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
#   与 gh api repos/knownothing20/agent2api-fix/commits/main --jq .sha 比对。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push main / v* tag → latest + 版本号 + sha；手动触发 → dev
      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
            type=sha

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
